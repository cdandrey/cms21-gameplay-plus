# Custom repairability groups generated from PartProperties.tsv.
# The rules are applied once when the first main menu is initialized.
# Each part ID comment shows its original game RepairGroup before this configuration is applied.
# The main modifyRepairGroups switch in CMS21GameplayPlus.cfg must also be enabled.
# enabled = false disables this file even when modifyRepairGroups is enabled.

# Priority, from highest to lowest:
# 1. NonRepairable forces listed parts to RepairGroup 0, regardless of every other group.
# 2. Repairability1..Repairability5 force the exact matching RepairGroup and overwrite both original and specialized values.
# 3. All other specialized groups use the modifier behavior described below.
# A part handled by a higher-priority group is ignored by every lower-priority group.
# If a part is listed in several Repairability1..Repairability5 groups, the first such group in this file wins.

# Specialized group modifier behavior:
# repairGroup = -1 disables the modifier for this group and preserves each part's default RepairGroup.
# repairGroup = 0 forces every non-priority part in the group to be non-repairable.
# repairGroup = 1..7 forces every non-priority part in the group to the selected RepairGroup.
# NonRepairable and Repairability1..Repairability5 entries always take priority over specialized groups.

enabled = true

